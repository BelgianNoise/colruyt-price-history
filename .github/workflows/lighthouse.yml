name: Lighthouse

on:
  pull_request:
    branches:
      - main

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - uses: treosh/lighthouse-ci-action@v12
        id: lighthouse-ci
        with:
          uploadArtifacts: true
          temporaryPublicStorage: true
          configPath: ./lighthouserc.js
          
      - name: Extract and Log Google API URLs
        if: always()
        run: |
          echo "::group::Lighthouse Report URLs"
          echo "📊 Extracted Report URLs:"
          
          # Get the run output and extract Google API URLs
          grep -o "https://storage.googleapis.com/lighthouse-infrastructure.appspot.com/reports/[0-9]*-[0-9]*.report.html" $GITHUB_STEP_SUMMARY || echo "No report URLs found"
          
          # Save URLs to a file for potential future use
          grep -o "https://storage.googleapis.com/lighthouse-infrastructure.appspot.com/reports/[0-9]*-[0-9]*.report.html" $GITHUB_STEP_SUMMARY > lighthouse_report_urls.txt || true
          
          echo "::endgroup::"
