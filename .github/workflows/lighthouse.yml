name: Lighthouse

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_DATABASE: ${{ secrets.DB_DATABASE }}
          BASE_URL: ${{ secrets.BASE_URL }}

      - name: Start server in background
        run: npm run preview &
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_DATABASE: ${{ secrets.DB_DATABASE }}
          BASE_URL: ${{ secrets.BASE_URL }}

      - name: Wait for server to start
        run: sleep 10

      - name: Run Lighthouse
        uses: treosh/lighthouse-ci-action@v10
        with:
          urls: |
            http://localhost:4173/
          uploadArtifacts: true
          temporaryPublicStorage: true
          budgetPath: ./lighthouse-budget.json
          configPath: ./lighthouserc.js
          runs: 3
          serverBaseUrl: ${{ github.event.pull_request.head.repo.html_url || github.event.repository.html_url }}
          serverToken: ${{ secrets.GITHUB_TOKEN }}
          pr:
            enabled: ${{ github.event_name == 'pull_request' }}
            comment: true
            commentUrl: ${{ github.event.pull_request.html_url }}
            commentTemplate: |
              ## ⚡️ Lighthouse Report

              | Category | Score |
              | --- | --- |
              | Performance | ${{ '{{' }} results.performance * 100 {{ '}}' }}% |
              | Accessibility | ${{ '{{' }} results.accessibility * 100 {{ '}}' }}% |
              | Best practices | ${{ '{{' }} results.bestPractices * 100 {{ '}}' }}% |
              | SEO | ${{ '{{' }} results.seo * 100 {{ '}}' }}% |
              | PWA | ${{ '{{' }} results.pwa * 100 {{ '}}' }}% |

              [View full report](${{ '{{' }} results.lhr.url {{ '}}' }})
